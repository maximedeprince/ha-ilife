clean_rooms:
  target:
    entity:
      integration: ilife
      domain: vacuum
  fields:
    rooms:
      required: true
      example: '["Salon", "Korytarz"]'
      selector:
        text:
          multiple: true
    passes:
      default: 1
      selector:
        number:
          min: 1
          max: 2
          mode: box

clean_zone:
  target:
    entity:
      integration: ilife
      domain: vacuum
  fields:
    zone:
      required: true
      example: "[-52, 31, 76, 159]"
      selector:
        object:
    passes:
      default: 1
      selector:
        number:
          min: 1
          max: 2
          mode: box

go_to:
  target:
    entity:
      integration: ilife
      domain: vacuum
  fields:
    x:
      required: true
      selector:
        number:
          min: -32768
          max: 32767
          mode: box
    y:
      required: true
      selector:
        number:
          min: -32768
          max: 32767
          mode: box

set_schedule:
  target:
    entity:
      integration: ilife
      domain: vacuum
  fields:
    slot:
      selector:
        number:
          min: 1
          max: 7
          mode: box
    time:
      example: "09:30"
      selector:
        time:
    days:
      example: "[0, 2, 4]"
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: "0"
            - label: Tuesday
              value: "1"
            - label: Wednesday
              value: "2"
            - label: Thursday
              value: "3"
            - label: Friday
              value: "4"
            - label: Saturday
              value: "5"
            - label: Sunday
              value: "6"
    enabled:
      selector:
        boolean:
    rooms:
      example: '["Salon"]'
      selector:
        text:
          multiple: true
    cycles:
      selector:
        number:
          min: 1
          max: 3
          mode: box

delete_schedule:
  target:
    entity:
      integration: ilife
      domain: vacuum
  fields:
    slot:
      required: true
      selector:
        number:
          min: 1
          max: 7
          mode: box
